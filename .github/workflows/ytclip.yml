name: Temporary YouTube clip

on:
  push:
    branches:
      - tmp-ytclip-ylkqo-20260825

permissions:
  contents: read

env:
  VIDEO_URL: https://www.youtube.com/watch?v=YLkqO-RqyeA
  OUTPUT_FILE: youtube-clip-53m44s-54m12s.mp4

jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Ensure FFmpeg is available
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Resolve merged video and seek directly to the interval
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$OUTPUT_FILE"

          python <<'PY'
          import json
          import os
          import re
          import urllib.parse
          import urllib.request

          source = os.environ['VIDEO_URL']
          endpoint = 'https://ahm7xmakki.com/api/alldl?url=' + urllib.parse.quote(source, safe='')
          request = urllib.request.Request(endpoint, headers={
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36',
              'Accept': 'application/json',
          })
          with urllib.request.urlopen(request, timeout=180) as response:
              payload = json.load(response)
          if not payload.get('success'):
              raise RuntimeError(f'Downloader API failed: {payload}')

          info = payload.get('mediaInfo') or {}
          direct = info.get('videoUrl')
          if not direct:
              # Prefer a likely progressive MP4 when the primary field is absent.
              candidates = []
              for item in info.get('qualities') or []:
                  url = item.get('url')
                  if not url:
                      continue
                  label = str(item.get('quality') or '')
                  match = re.search(r'(\d+)', label)
                  height = int(match.group(1)) if match else 0
                  candidates.append((height, url))
              if candidates:
                  direct = max(candidates)[1]
          if not direct:
              raise RuntimeError('No usable video URL returned')

          print('Resolved:', info.get('title') or '(untitled)')
          with open('/tmp/direct-url.txt', 'w', encoding='utf-8') as handle:
              handle.write(direct)
          PY

          DIRECT_URL="$(cat /tmp/direct-url.txt)"
          # Input-side seeking lets FFmpeg request only data around 53:44 when the
          # remote server supports byte-range requests, instead of downloading the full video.
          ffmpeg -hide_banner -y \
            -rw_timeout 120000000 \
            -user_agent 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36' \
            -ss 00:53:44 -i "$DIRECT_URL" -t 28 \
            -map 0:v:0 -map 0:a:0? \
            -c:v libx264 -preset fast -crf 18 \
            -c:a aac -b:a 192k \
            -movflags +faststart "$OUTPUT_FILE"

          test -s "$OUTPUT_FILE"
          DURATION="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$OUTPUT_FILE")"
          python - "$DURATION" <<'PY'
          import sys
          duration = float(sys.argv[1])
          if not 27.0 <= duration <= 29.0:
              raise SystemExit(f'Unexpected duration: {duration}')
          print(f'Validated duration: {duration:.3f}s')
          PY
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=codec_name,width,height,r_frame_rate \
            -of default=noprint_wrappers=1 "$OUTPUT_FILE"

      - name: Upload clip
        uses: actions/upload-artifact@v4
        with:
          name: youtube-clip-53m44s-54m12s
          path: youtube-clip-53m44s-54m12s.mp4
          if-no-files-found: error
          retention-days: 1
